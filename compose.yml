# compose.yml

services:
  pasted:
    build: . # Build from this directory
    ports:
      - "5000:80" # Send 80 from the container to 5000 on your host
    env_file: .env # Pass through .env
    volumes:
      - /srv/pasted:/srv/pasted
    depends_on: # Pasted depends on its db, so make sure thats started.
      - db

  db:
    image: mariadb:latest # Pull MariaDB
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadbdata:/var/lib/mysql # Create its storage directory
    env_file: .env # Get .env again

# This section just creates the storage volume for MariaDB
volumes:
  mariadbdata: {}